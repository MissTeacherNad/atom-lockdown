<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10263d">
<title>Atom Lockdown | Miss Yahia</title>
<style>
:root{--navy:#10263d;--ink:#19384e;--blue:#287cc1;--paper:#f3f7fa;--line:#c7d9e4;--green:#16804f;--red:#b23a3a;--amber:#f0b94b}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
header{background:var(--navy);color:white;padding:18px max(20px,calc((100vw - 1040px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{letter-spacing:.12em;font-size:.78rem;font-weight:800}.brand b{display:block;letter-spacing:.02em;font-size:1.15rem}.clock{font-variant-numeric:tabular-nums;background:#26445d;border:1px solid #527086;padding:7px 12px;border-radius:8px;white-space:nowrap}
main{max-width:1040px;margin:auto;padding:26px 20px 70px}.hero{border:1px solid var(--line);background:white;border-radius:16px;padding:clamp(22px,4vw,42px);box-shadow:0 9px 28px #10263d12}.eyebrow{text-transform:uppercase;font-weight:800;letter-spacing:.14em;color:var(--blue);font-size:.75rem}h1{font-size:clamp(2.2rem,5vw,4.2rem);letter-spacing:-.045em;line-height:1.02;margin:10px 0 18px;color:var(--navy)}h2{font-size:1.55rem;margin:0 0 8px}h3{font-size:1.05rem;margin:24px 0 8px}p{margin:8px 0 16px}.intro{max-width:65ch;font-size:1.08rem}.banner{background:#e5f0f7;border-left:4px solid var(--blue);padding:14px 18px;border-radius:6px;margin:20px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.btn{border:0;border-radius:9px;padding:11px 17px;font-weight:750;background:var(--blue);color:white;min-height:44px}.btn:hover{filter:brightness(.92)}.btn.secondary{background:white;color:var(--ink);border:1px solid #7896aa}.btn.small{font-size:.9rem;padding:8px 12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.step{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;font-size:.84rem}.step.current{border:2px solid var(--blue)}.step.done{background:#e2f3e9;border-color:#76bc93}.step b{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}.layout{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:18px;margin-top:18px}.panel,.side{background:white;border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px)}.side{align-self:start}.case{display:inline-block;background:var(--navy);color:white;border-radius:5px;padding:3px 9px;text-transform:uppercase;letter-spacing:.1em;font-size:.73rem;font-weight:800}.question{border-top:1px solid var(--line);padding:18px 0}.question:first-of-type{border-top:0}.question p{font-weight:700;margin:0 0 11px}.choices{display:grid;gap:8px}.choice{display:block;position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1.5px solid #adc4d2;border-radius:9px;padding:10px 13px;background:#fff;cursor:pointer}.choice input:checked+span{border-color:var(--blue);background:#e9f4fd;box-shadow:inset 0 0 0 1px var(--blue)}.choice input:focus-visible+span{outline:3px solid var(--amber)}.feedback{min-height:1.6em;font-weight:700;margin:10px 0;color:var(--red)}.feedback.ok{color:var(--green)}.hint{background:#fff7e5;border:1px solid #e9c778;border-radius:8px;padding:11px 13px;margin-top:12px}.hint summary{cursor:pointer;font-weight:750}.fragment{font-size:2.4rem;line-height:1;font-weight:900;color:var(--green);border:2px dashed #7bbb96;border-radius:10px;background:#eff8f1;padding:17px;margin:16px 0}.fragment span{display:block;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:7px}.formula{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:800;background:#ebf3f8;border-radius:5px;padding:2px 5px}.glossary{font-size:.92rem}.glossary dt{font-weight:800;margin-top:11px}.glossary dd{margin-left:0}.code-input{width:100%;max-width:240px;text-align:center;font-size:2rem;letter-spacing:.25em;font-weight:800;border:2px solid #7293a7;border-radius:10px;padding:8px 10px;margin:8px 0 14px}.muted{color:#526c7e}.status{color:var(--green);font-weight:800}.footer{font-size:.82rem;color:#526c7e;margin-top:30px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:740px){.layout{grid-template-columns:1fr}.progress{grid-template-columns:repeat(2,1fr)}header{padding:14px 20px}}@media(prefers-reduced-motion:no-preference){.panel{animation:appear .25s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body><header><div class="brand">DNL · PHYSICS & CHEMISTRY<b>ATOM LOCKDOWN</b></div><div class="clock" aria-label="Elapsed time">⏱ <span id="timer">00:00</span></div></header><main><div id="app"></div><footer class="footer">Miss Yahia · 26/27 · No account or personal data required. Progress stays on this device.</footer></main>
<script>
(() => {
'use strict';
const KEY='atom-lockdown-yahia-v1';
const missions=[
 {label:'01 · LAB ENGLISH',title:'The laboratory archive',lead:'The safety system has scrambled its English labels. Identify the correct scientific terms.',questions:[
  {q:'Which part of an atom contains protons and neutrons?',options:['electron cloud','nucleus','element'],answer:1,explain:'The nucleus contains protons and neutrons.'},
  {q:'Which two particles are nucleons?',options:['protons and electrons','neutrons and electrons','protons and neutrons'],answer:2,explain:'Nucleons are the particles in the nucleus: protons and neutrons.'},
  {q:'What is a chemical element defined by?',options:['its number of protons','its number of neutrons','its number of electrons'],answer:0,explain:'The number of protons identifies the element.'}
 ],fragment:'2',derive:'Count the TWO types of nucleon: proton and neutron.',hint:'Nucleons are inside the nucleus. Electrons are outside it.'},
 {label:'02 · NUCLEUS DATA',title:'Repair the oxygen record',lead:'An oxygen-16 atom has atomic number Z = 8 and mass number A = 16. It is neutral.',questions:[
  {q:'How many protons are in oxygen-16?',options:['8','16','24'],answer:0,explain:'Z is the number of protons, so p⁺ = 8.'},
  {q:'How many neutrons are in oxygen-16?',options:['16','8','24'],answer:1,explain:'n = A − Z = 16 − 8 = 8.'},
  {q:'How many electrons does this neutral atom have?',options:['16','8','0'],answer:1,explain:'A neutral atom has as many electrons as protons: 8.'}
 ],fragment:'8',derive:'The fragment is the number of neutrons in oxygen-16.',hint:'Z = protons. A = protons + neutrons. A neutral atom has e⁻ = p⁺.'},
 {label:'03 · CHARGE ALERT',title:'Track the missing electron',lead:'A neutral sodium-23 atom has 11 protons and 11 electrons. The system detects a sodium ion Na⁺ with 11 protons and 10 electrons.',questions:[
  {q:'What changed when the neutral atom became Na⁺?',options:['one proton was lost','one neutron was lost','one electron was lost'],answer:2,explain:'Na⁺ forms when a sodium atom loses one electron.'},
  {q:'What stayed the same?',options:['the number of protons','the number of electrons','the overall charge'],answer:0,explain:'Its 11 protons remain unchanged, so it is still sodium.'},
  {q:'How many neutrons does sodium-23 have?',options:['23','12','11'],answer:1,explain:'n = A − Z = 23 − 11 = 12.'}
 ],fragment:'1',derive:'The fragment is the number of electrons lost to form Na⁺.',hint:'A positive ion has lost electrons. For sodium-23, A = 23 and Z = 11.'},
 {label:'04 · ISOTOPE FILE',title:'Compare the carbon samples',lead:'Carbon-12 and carbon-14 each contain 6 protons. Their mass numbers are 12 and 14.',questions:[
  {q:'How many neutrons does carbon-12 have?',options:['6','12','18'],answer:0,explain:'n = 12 − 6 = 6.'},
  {q:'How many neutrons does carbon-14 have?',options:['6','8','14'],answer:1,explain:'n = 14 − 6 = 8.'},
  {q:'Why are they isotopes of the same element?',options:['same electrons, different protons','same protons, different neutrons','same neutrons, different protons'],answer:1,explain:'Both have Z = 6, but their neutron numbers differ.'}
 ],fragment:'2',derive:'The fragment is the DIFFERENCE between their neutron counts: 8 − 6.',hint:'For each isotope, subtract Z from A. Isotopes have the same protons.'}
];
let saved;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};
let state={stage:0,fragments:[],started:Date.now(),finished:false,...(saved&&typeof saved==='object'?saved:{})};
state.stage=Math.min(4,Math.max(0,Number(state.stage)||0));state.fragments=Array.isArray(state.fragments)?state.fragments.slice(0,4):[];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const glossary=`<div class="side"><h3>Field notes · vocabulary</h3><dl class="glossary"><dt>atom · atome</dt><dd>One unit of a chemical element.</dd><dt>nucleus · noyau</dt><dd>The centre, containing protons and neutrons.</dd><dt>nucleon · nucléon</dt><dd>A proton or a neutron.</dd><dt>Z · atomic number</dt><dd>Number of protons.</dd><dt>A · mass number</dt><dd>Protons + neutrons in one nucleus.</dd><dt>neutral atom</dt><dd>Electrons = protons.</dd><dt>ion</dt><dd>Electrons gained or lost.</dd><dt>isotope</dt><dd>Same protons, different neutrons.</dd></dl><p class="muted">Use <span class="formula">n = A − Z</span>. The decimal atomic mass on a periodic table is a different quantity.</p></div>`;
function progress(){return `<nav class="progress" aria-label="Mission progress">${missions.map((m,i)=>`<div class="step ${i<state.stage?'done':i===state.stage?'current':''}"><b>${i<state.stage?'Verified':i===state.stage?'Active':'Locked'}</b>${esc(m.label)}</div>`).join('')}</nav>`}
function shell(content){app.innerHTML=`<div class="hero"><div class="eyebrow">Laboratory incident · 45 minute class mission</div><h1>Atom Lockdown</h1><p class="intro">Four damaged records. Four data fragments. Restore the lab archive before the lockdown protocol completes.</p><div class="banner">Work in pairs. Read the field notes if needed. Check each record, collect its fragment, then enter the four digits in mission order.</div><div class="row"><button class="btn secondary small" id="restart">Start again</button><span class="muted">${state.stage===4?'All records verified':`${state.stage} of 4 records verified`}</span></div></div>${progress()}<div class="layout"><section class="panel" id="mission">${content}</section>${glossary}</div>`;document.getElementById('restart').onclick=()=>{if(confirm('Erase progress on this device and start again?')){state={stage:0,fragments:[],started:Date.now(),finished:false};save();render()}}}
function render(){if(state.stage===4){final();return}const m=missions[state.stage];shell(`<span class="case">Data file ${state.stage+1} / 4</span><h2 style="margin-top:12px">${esc(m.title)}</h2><p>${esc(m.lead)}</p><form id="missionForm">${m.questions.map((q,j)=>`<div class="question"><p>${j+1}. ${esc(q.q)}</p><div class="choices">${q.options.map((o,k)=>`<label class="choice"><input type="radio" name="q${j}" value="${k}" required><span>${esc(o)}</span></label>`).join('')}</div></div>`).join('')}<details class="hint"><summary>Need a hint?</summary><p>${esc(m.hint)}</p></details><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button class="btn" type="submit">Verify this file</button></form>`);document.getElementById('missionForm').onsubmit=e=>{e.preventDefault();let answers=m.questions.map((_,j)=>document.querySelector(`input[name=q${j}]:checked`));let f=document.getElementById('feedback');if(answers.some(v=>!v)){f.textContent='Answer all three questions first.';return}let wrong=answers.findIndex((v,j)=>Number(v.value)!==m.questions[j].answer);if(wrong>=0){f.classList.remove('ok');f.textContent=`Check answer ${wrong+1}. ${m.questions[wrong].explain}`;return}f.classList.add('ok');f.textContent='File verified.';document.getElementById('mission').innerHTML=`<span class="case">Verified file ${state.stage+1}</span><h2 style="margin-top:12px">Data fragment recovered</h2><p>${esc(m.derive)}</p><div class="fragment"><span>Fragment ${state.stage+1}</span>${m.fragment}</div><p class="status">Correct. Write this digit down or keep this page open.</p><button class="btn" id="next">${state.stage===3?'Go to final lock':'Open next file'}</button>`;document.getElementById('next').onclick=()=>{state.fragments[state.stage]=m.fragment;state.stage++;save();render()}}}
function final(){shell(`<span class="case">Final lock</span><h2 style="margin-top:12px">Restore the archive</h2><p>Enter the four fragments in mission order. Each digit was obtained from your scientific answers.</p><div class="row">${state.fragments.map((v,i)=>`<div class="step done"><b>File ${i+1}</b>${esc(v)}</div>`).join('')}</div>${state.finished?`<div class="fragment"><span>Archive status</span>OPEN</div><p class="status">Lockdown lifted. All four files restored.</p><p>Final check: Z identifies an element, A counts nucleons, an ion changes electrons, and isotopes differ in neutrons.</p>`:`<form id="lockForm"><label for="code"><h3>Four digit access code</h3></label><input class="code-input" id="code" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="lockfeedback"><div><button class="btn" type="submit">Unlock archive</button></div><p class="feedback" id="lockfeedback" role="status" aria-live="polite"></p></form>`}<p class="muted">Finished early? Explain to your partner why Na⁺ is still sodium and why carbon-12 and carbon-14 are both carbon.</p>`);let form=document.getElementById('lockForm');if(form)form.onsubmit=e=>{e.preventDefault();let code=document.getElementById('code').value.trim();if(code===state.fragments.join('')){state.finished=true;save();final()}else document.getElementById('lockfeedback').textContent='The digits are correct only in file order. Check your four fragments.'}}
function tick(){let n=Math.max(0,Math.floor((Date.now()-state.started)/1000));document.getElementById('timer').textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}render();tick();setInterval(tick,1000);
})();
</script></body></html>
